<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCFF內部物資申請平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @media print {
      body * { visibility: hidden; }
      #printableReportArea, #printableReportArea * { visibility: visible; }
      #printableReportArea { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-light">

<div class="container py-4">
  <!-- 頂部列 -->
  <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
    <h2 class="h4 mb-0 fw-bold text-primary">BCFF物資申請系統</h2>
    <div id="userInfo" class="d-none">
      <span id="userNameDisplay" class="me-2 fw-bold text-secondary"></span>
      <button class="btn btn-outline-danger btn-sm" onclick="logout()">登出</button>
    </div>
  </div>

  <!-- 1. 登入區塊 -->
  <div id="loginCard" class="card mx-auto shadow-sm" style="max-width: 400px; margin-top: 50px;">
    <div class="card-body p-4">
      <h5 class="card-title mb-3 fw-bold text-center">同仁登入</h5>
      <div class="mb-3">
        <label class="form-label text-muted small">電子郵件</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="user@company.org">
      </div>
      <div class="mb-3">
        <label class="form-label text-muted small">密碼</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="請輸入密碼">
      </div>
      <button class="btn btn-primary w-100 mt-2" id="loginBtn" onclick="login()">登入系統</button>
    </div>
  </div>

  <!-- 2. 主要功能區 (登入後顯示) -->
  <div id="mainContent" class="d-none">
    <!-- 頁籤導覽 -->
    <ul class="nav nav-tabs mb-4">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#shopTab">物資申購</button>
      </li>
      <li class="nav-item d-none" id="adminTabBtn">
        <button class="nav-link text-danger" data-bs-toggle="tab" data-bs-target="#adminTab">後台管理與報表</button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- 申購區 -->
      <div class="tab-pane fade show active" id="shopTab">
        <div class="row g-4">
          <div class="col-md-8">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="mb-0 fw-bold">可申購物資</h5>
              <button class="btn btn-sm btn-outline-secondary" onclick="loadProducts()">重新整理清單</button>
            </div>
            
            <!-- 搜尋關鍵字欄位 -->
            <div class="mb-3">
              <input type="text" id="searchInput" class="form-control" placeholder="🔍 搜尋物資名稱或分類..." onkeyup="filterProducts()">
            </div>

            <div id="productList" class="row g-3">
              <div class="text-muted">載入物資清單中...</div>
            </div>
          </div>

          <div class="col-md-4">
            <div class="card shadow-sm">
              <div class="card-body">
                <h5 class="card-title fw-bold mb-3">申請清單</h5>
                <ul id="cartList" class="list-group mb-3">
                  <li class="list-group-item text-muted text-center py-3">尚未選擇物資</li>
                </ul>

                <!-- 訂單備註欄位 -->
                <div class="mb-3">
                  <label class="form-label text-muted small fw-bold">申請備註／用途說明</label>
                  <textarea id="orderNote" class="form-control" rows="2" placeholder="請填寫用途或特別需求..."></textarea>
                </div>

                <button class="btn btn-success w-100" id="submitBtn" onclick="submitOrder()">送出申請單</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 後台管理區 -->
      <div class="tab-pane fade" id="adminTab">
        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <h5 class="card-title fw-bold text-danger mb-3">產生每月申購核銷報表</h5>
            <p class="text-muted small">選擇月份後將自動匯出含「申請人簽名欄」與「單位主管簽核欄」的報表，可直接列印或另存 PDF。</p>
            <div class="row g-2 align-items-center">
              <div class="col-auto">
                <input type="month" id="reportMonth" class="form-control">
              </div>
              <div class="col-auto">
                <button class="btn btn-primary" onclick="generateReport()">預覽並列印報表</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 報表列印預覽區域 -->
        <div id="printableReportArea" class="d-none bg-white p-4 border rounded">
          <div class="d-flex justify-content-between align-items-center mb-3 no-print">
            <h6 class="fw-bold text-success mb-0">報表預覽區</h6>
            <button class="btn btn-success btn-sm" onclick="window.print()">🖨️ 列印 / 存為 PDF</button>
          </div>
          
          <div class="text-center mb-4">
            <h3 class="fw-bold mb-1">伯大尼兒少家庭基金會物資申請月份明細表</h3>
            <p class="text-muted" id="reportTitleMonth">月份：</p>
          </div>

          <table class="table table-bordered align-middle" id="reportTable">
            <thead class="table-light">
              <tr class="text-center">
                <th style="width: 15%;">申請日期</th>
                <th style="width: 15%;">申請同仁</th>
                <th style="width: 45%;">物資名稱與數量</th>
                <th style="width: 25%;">申請人簽名欄</th>
              </tr>
            </thead>
            <tbody id="reportTableBody">
            </tbody>
          </table>

          <!-- 簽核區塊 -->
          <div class="row mt-5 pt-4 text-center" style="font-size: 1.1rem;">
            <div class="col-4">
              <p class="fw-bold mb-5">執行長：________________</p>
            </div>
            <div class="col-4">
              <p class="fw-bold mb-5">主管：________________</p>
            </div>
            <div class="col-4">
              <p class="fw-bold mb-5">製表：________________</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwBBhH0RqhkWLyyqcgT86uYkuhpIbnAh5uH934wjd4priuU0jZ0bODNED1K08XMyqHZ/exec"; 
  
  let currentUser = null;
  let cart = [];
  let allProducts = [];

  async function postToGAS(data) {
    const response = await fetch(GAS_URL, {
      method: "POST",
      redirect: "follow",
      body: JSON.stringify(data)
    });
    return await response.json();
  }

  async function login() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value.trim();

    if (!email || !password) {
      alert("請填寫 Email 與密碼");
      return;
    }

    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.innerText = "驗證中...";

    try {
      const result = await postToGAS({ action: "login", email, password });

      if (result.success) {
        currentUser = { email, name: result.name, role: result.role };
        document.getElementById("loginCard").classList.add("d-none");
        document.getElementById("mainContent").classList.remove("d-none");
        document.getElementById("userInfo").classList.remove("d-none");
        document.getElementById("userNameDisplay").innerText = result.name;

        if (result.role === "admin") {
          document.getElementById("adminTabBtn").classList.remove("d-none");
        }
        loadProducts();
      } else {
        alert(result.message || "帳號或密碼錯誤");
      }
    } catch (err) {
      alert("連線失敗！請確認 Apps Script 部署權限。");
    } finally {
      btn.disabled = false;
      btn.innerText = "登入系統";
    }
  }

  function logout() {
    location.reload();
  }

  async function loadProducts() {
    const container = document.getElementById("productList");
    container.innerHTML = '<div class="text-muted">載入物資清單中...</div>';

    try {
      const res = await fetch(`${GAS_URL}?action=getProducts`);
      allProducts = await res.json();
      renderProducts(allProducts);
    } catch (err) {
      container.innerHTML = '<div class="text-danger">無法載入物資，請確認後台試算表。</div>';
    }
  }

  function renderProducts(products) {
    const container = document.getElementById("productList");
    container.innerHTML = "";

    if (products.length === 0) {
      container.innerHTML = '<div class="text-muted">未找到符合的物資</div>';
      return;
    }

    products.forEach(p => {
      container.innerHTML += `
        <div class="col-md-6">
          <div class="card h-100 shadow-sm border-0 bg-white">
            <div class="card-body d-flex flex-column justify-content-between">
              <div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <h6 class="fw-bold mb-0">${p.name}</h6>
                  <span class="badge bg-light text-dark border">${p.category}</span>
                </div>
                <p class="text-muted small mb-2">庫存剩餘：<strong class="text-primary">${p.stock}</strong></p>
              </div>
              <button class="btn btn-sm btn-outline-primary mt-2 w-100" onclick="addToCart('${p.name}', ${p.stock})">加入申請單</button>
            </div>
          </div>
        </div>`;
    });
  }

  function filterProducts() {
    const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
    const filtered = allProducts.filter(p => 
      p.name.toLowerCase().includes(keyword) || 
      p.category.toLowerCase().includes(keyword)
    );
    renderProducts(filtered);
  }

  function addToCart(name, stock) {
    const exist = cart.find(i => i.name === name);
    if (exist) {
      if (exist.qty < stock) {
        exist.qty++;
      } else {
        alert("已達目前庫存上限！");
      }
    } else {
      cart.push({ name, qty: 1 });
    }
    renderCart();
  }

  function renderCart() {
    const list = document.getElementById("cartList");
    list.innerHTML = "";

    if (cart.length === 0) {
      list.innerHTML = '<li class="list-group-item text-muted text-center py-3">尚未選擇物資</li>';
      return;
    }

    cart.forEach((item, index) => {
      list.innerHTML += `
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <div>
            <div>${item.name}</div>
            <small class="text-muted">數量: ${item.qty}</small>
          </div>
          <button class="btn btn-sm btn-link text-danger p-0" onclick="removeFromCart(${index})">移除</button>
        </li>`;
    });
  }

  function removeFromCart(index) {
    cart.splice(index, 1);
    renderCart();
  }

  async function submitOrder() {
    if (cart.length === 0) return alert("請先選擇物資！");

    const note = document.getElementById("orderNote").value.trim();
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.innerText = "提交中...";

    const payload = {
      action: "createOrder",
      userEmail: currentUser.email,
      userName: currentUser.name,
      items: cart,
      note: note
    };

    try {
      const result = await postToGAS(payload);

      if (result.success) {
        alert("申請完成！已發送 Mail 通知管理同工。");
        cart = [];
        document.getElementById("orderNote").value = "";
        renderCart();
        loadProducts();
      } else {
        alert("申請失敗，請再試一次。");
      }
    } catch (err) {
      alert("提交發生錯誤，請檢查網路連線。");
    } finally {
      btn.disabled = false;
      btn.innerText = "送出申請單";
    }
  }

  // 產生每月申購報表（依「日期 + 申請人」分組，品項以頓號「、」接續呈現，無備註欄）
  async function generateReport() {
    const month = document.getElementById("reportMonth").value;
    if (!month) return alert("請選擇要匯出的月份");

    try {
      const res = await fetch(`${GAS_URL}?action=getMonthlyReport&month=${month}`);
      const rawData = await res.json();

      if (!rawData || rawData.length === 0) return alert("該月份查無申購紀錄");

      document.getElementById("reportTitleMonth").innerText = `申購月份：${month}`;
      const tbody = document.getElementById("reportTableBody");
      tbody.innerHTML = "";

      // 依「日期 (YYYY-MM-DD) + 申請同仁」作為 Key 分組
      const groupedMap = new Map();

      rawData.forEach(r => {
        const dateStr = r.date ? r.date.split(" ")[0] : "";
        const key = `${dateStr}_${r.userName}`;

        if (!groupedMap.has(key)) {
          groupedMap.set(key, {
            date: dateStr,
            userName: r.userName,
            items: []
          });
        }

        const group = groupedMap.get(key);
        group.items.push(`${r.itemName} × ${r.qty}`);
      });

      // 渲染結果：使用「、」將多個物資品項連接成一行文字[cite: 1]
      groupedMap.forEach(group => {
        const itemsText = group.items.join("、");

        tbody.innerHTML += `
          <tr>
            <td class="text-center">${group.date}</td>
            <td class="text-center">${group.userName}</td>
            <td style="text-align: left; line-height: 1.5;">${itemsText}</td>
            <td class="text-center" style="height: 45px;"></td>
          </tr>`;
      });

      document.getElementById("printableReportArea").classList.remove("d-none");
    } catch (err) {
      alert("報表產生失敗，請確認後台回傳格式。");
    }
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
