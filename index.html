<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行政物資申購與管理系統</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .card {
      border: none;
      box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
    }
    .item-card {
      transition: transform 0.2s;
    }
    .item-card:hover {
      transform: translateY(-3px);
    }
    /* 報表列印專用樣式 */
    @media print {
      .no-print, nav, .btn, input, select, .card-header, #loginSection, #userSection {
        display: none !important;
      }
      body {
        background: white !important;
        color: black !important;
      }
      .container {
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .card {
        box-shadow: none !important;
        border: none !important;
      }
      /* 印表時隱藏報表中的「備註」欄位 (第 4 欄) */
      #reportTable th:nth-child(4),
      #reportTable td:nth-child(4) {
        display: none !important;
      }
      table {
        width: 100% !important;
        border-collapse: collapse !important;
      }
      th, td {
        border: 1px solid #000 !important;
        padding: 8px !important;
        vertical-align: middle !important;
      }
      .print-title {
        display: block !important;
        text-align: center;
        font-size: 1.5rem;
        font-weight: bold;
        margin-bottom: 15px;
      }
    }
    .print-title {
      display: none;
    }
  </style>
</head>
<body>

  <!-- 導覽列 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary no-print">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">行政物資申購系統</a>
      <div class="d-flex align-items-center text-white" id="userInfo">
        <!-- 使用者資訊動態載入 -->
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <!-- 1. 登入區塊 -->
    <div id="loginSection" class="row justify-content-center">
      <div class="col-md-5">
        <div class="card p-4">
          <h4 class="card-title text-center mb-4 fw-bold">系統登入</h4>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Email 帳號</label>
              <input type="email" id="loginEmail" class="form-control" required placeholder="user@domain.org">
            </div>
            <div class="mb-3">
              <label class="form-label">密碼</label>
              <input type="password" id="loginPassword" class="form-control" required>
            </div>
            <button type="submit" id="btnLogin" class="btn btn-primary w-100">登入</button>
          </form>
        </div>
      </div>
    </div>

    <!-- 2. 同仁物資申購區塊 -->
    <div id="userSection" class="d-none">
      <div class="row">
        <!-- 左側：物資清單與搜尋 -->
        <div class="col-md-8 mb-4">
          <div class="card p-3 mb-3">
            <div class="row g-2">
              <div class="col-md-8">
                <input type="text" id="searchInput" class="form-control" placeholder="搜尋物資名稱或分類...">
              </div>
              <div class="col-md-4">
                <select id="categorySelect" class="form-select">
                  <option value="">全部分類</option>
                </select>
              </div>
            </div>
          </div>
          <div id="productGrid" class="row row-cols-1 row-cols-md-3 g-3">
            <!-- 物資卡片動態載入 -->
          </div>
        </div>

        <!-- 右側：申購清單 (購物車) -->
        <div class="col-md-4">
          <div class="card p-3 sticky-top" style="top: 20px;">
            <h5 class="fw-bold mb-3">申購清單</h5>
            <div id="cartList" class="mb-3" style="max-height: 300px; overflow-y: auto;">
              <p class="text-muted text-center py-3">尚未選擇任何物資</p>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">用途說明 / 備註：</label>
              <textarea id="orderNote" class="form-control" rows="2" placeholder="請註明用途或領用單位..."></textarea>
            </div>
            <button id="btnSubmitOrder" class="btn btn-success w-100" onclick="submitOrder()" disabled>送出申購單</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. 管理者月報表區塊 -->
    <div id="adminSection" class="d-none">
      <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3 no-print">
          <h4 class="fw-bold mb-0">月度物資申購簽收報表</h4>
          <div class="d-flex gap-2">
            <input type="month" id="reportMonth" class="form-control">
            <button class="btn btn-primary" onclick="loadMonthlyReport()">查詢</button>
            <button class="btn btn-secondary" onclick="window.print()">列印 / 另存PDF</button>
          </div>
        </div>

        <!-- 列印時顯示的標題 -->
        <div class="print-title">
          <span id="printTitleText">行政物資申購月報表</span>
        </div>

        <!-- 報表表格 -->
        <div class="table-responsive">
          <table id="reportTable" class="table table-bordered align-middle">
            <thead class="table-light">
              <tr>
                <th style="width: 15%;">申請日期</th>
                <th style="width: 15%;">申請人</th>
                <th style="width: 35%;">申購品項與數量</th>
                <th style="width: 15%;">備註</th>
                <th style="width: 20%;">領取人簽名</th>
              </tr>
            </thead>
            <tbody id="reportTableBody">
              <tr><td colspan="5" class="text-center text-muted">請選擇月份進行查詢</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ 請填入您的 Google Apps Script 部署 URL
    const GAS_URL = "YOUR_GAS_DEPLOYMENT_URL_HERE";

    let currentUser = null;
    let productsData = [];
    let cart = [];

    // 初始化
    document.addEventListener("DOMContentLoaded", () => {
      // 設定預設月份為當月
      const now = new Date();
      const currentMonth = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, '0');
      document.getElementById("reportMonth").value = currentMonth;

      // 綁定搜尋與篩選事件
      document.getElementById("searchInput").addEventListener("input", filterProducts);
      document.getElementById("categorySelect").addEventListener("change", filterProducts);

      // 綁定登入事件
      document.getElementById("loginForm").addEventListener("submit", handleLogin);
    });

    // 1. 處理登入
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      const btn = document.getElementById("btnLogin");
      
      btn.disabled = true;
      btn.innerText = "登入中...";

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "login", email, password })
        });
        const result = await res.json();

        if (result.success) {
          currentUser = { email, name: result.name, role: result.role };
          document.getElementById("loginSection").classList.add("d-none");
          
          let navHtml = `<span class="me-3">${currentUser.name} (${currentUser.role === 'admin' ? '管理者' : '同仁'})</span>
                         <button class="btn btn-outline-light btn-sm" onclick="logout()">登出</button>`;
          document.getElementById("userInfo").innerHTML = navHtml;

          if (currentUser.role === "admin") {
            document.getElementById("adminSection").classList.remove("d-none");
            loadMonthlyReport();
          } else {
            document.getElementById("userSection").classList.remove("d-none");
            loadProducts();
          }
        } else {
          alert("登入失敗：" + result.message);
        }
      } catch (err) {
        alert("連線錯誤：" + err);
      } finally {
        btn.disabled = false;
        btn.innerText = "登入";
      }
    }

    function logout() {
      location.reload();
    }

    // 2. 載入與渲染物資
    async function loadProducts() {
      try {
        const res = await fetch(`${GAS_URL}?action=getProducts`);
        productsData = await res.json();
        
        // 建立分類選單
        const categories = [...new Set(productsData.map(p => p.category))];
        const catSelect = document.getElementById("categorySelect");
        catSelect.innerHTML = `<option value="">全部分類</option>` + 
          categories.map(c => `<option value="${c}">${c}</option>`).join("");

        renderProducts(productsData);
      } catch (err) {
        console.error("載入物資失敗", err);
      }
    }

    function renderProducts(list) {
      const grid = document.getElementById("productGrid");
      grid.innerHTML = list.map(item => `
        <div class="col">
          <div class="card h-100 item-card p-3">
            <span class="badge bg-secondary mb-2 align-self-start">${item.category}</span>
            <h6 class="fw-bold">${item.name}</h6>
            <p class="text-muted small mb-2">剩餘庫存：${item.stock}</p>
            <button class="btn btn-outline-primary btn-sm mt-auto" 
                    onclick="addToCart('${item.name}')" 
                    ${item.stock <= 0 ? 'disabled' : ''}>
              ${item.stock > 0 ? '加入申購' : '庫存不足'}
            </button>
          </div>
        </div>
      `).join("");
    }

    function filterProducts() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const category = document.getElementById("categorySelect").value;

      const filtered = productsData.filter(p => {
        const matchSearch = p.name.toLowerCase().includes(search) || p.category.toLowerCase().includes(search);
        const matchCat = category === "" || p.category === category;
        return matchSearch && matchCat;
      });

      renderProducts(filtered);
    }

    // 3. 購物車邏輯
    function addToCart(itemName) {
      const product = productsData.find(p => p.name === itemName);
      if (!product) return;

      const cartItem = cart.find(c => c.name === itemName);
      if (cartItem) {
        if (cartItem.qty < product.stock) {
          cartItem.qty++;
        } else {
          alert("已達庫存上限");
        }
      } else {
        cart.push({ name: itemName, qty: 1, stock: product.stock });
      }
      renderCart();
    }

    function updateQty(itemName, delta) {
      const item = cart.find(c => c.name === itemName);
      if (!item) return;

      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(c => c.name !== itemName);
      } else if (item.qty > item.stock) {
        item.qty = item.stock;
        alert("已達庫存上限");
      }
      renderCart();
    }

    function renderCart() {
      const list = document.getElementById("cartList");
      const btn = document.getElementById("btnSubmitOrder");

      if (cart.length === 0) {
        list.innerHTML = `<p class="text-muted text-center py-3">尚未選擇任何物資</p>`;
        btn.disabled = true;
        return;
      }

      btn.disabled = false;
      list.innerHTML = cart.map(item => `
        <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom">
          <div>
            <div class="fw-bold">${item.name}</div>
          </div>
          <div class="d-flex align-items-center gap-2">
            <button class="btn btn-sm btn-outline-secondary px-2" onclick="updateQty('${item.name}', -1)">-</button>
            <span>${item.qty}</span>
            <button class="btn btn-sm btn-outline-secondary px-2" onclick="updateQty('${item.name}', 1)">+</button>
          </div>
        </div>
      `).join("");
    }

    // 4. 提交申購單
    async function submitOrder() {
      const note = document.getElementById("orderNote").value;
      const btn = document.getElementById("btnSubmitOrder");

      btn.disabled = true;
      btn.innerText = "提交中...";

      const payload = {
        action: "createOrder",
        userEmail: currentUser.email,
        userName: currentUser.name,
        items: cart,
        note: note
      };

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success) {
          alert("申購單已成功送出！");
          cart = [];
          document.getElementById("orderNote").value = "";
          renderCart();
          loadProducts(); // 重新載入最新庫存
        } else {
          alert("送出失敗：" + result.message);
        }
      } catch (err) {
        alert("送出失敗：" + err);
      } finally {
        btn.disabled = false;
        btn.innerText = "送出申購單";
      }
    }

    // 5. 載入管理者月報表 (自動按日期與同仁合併)
    async function loadMonthlyReport() {
      const month = document.getElementById("reportMonth").value;
      if (!month) return;

      document.getElementById("printTitleText").innerText = `${month} 行政物資申購月報表`;
      const tbody = document.getElementById("reportTableBody");
      tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">載入中...</td></tr>`;

      try {
        const res = await fetch(`${GAS_URL}?action=getMonthlyReport&month=${month}`);
        const data = await res.json();

        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">該月份無申購紀錄</td></tr>`;
          return;
        }

        tbody.innerHTML = data.map(row => `
          <tr>
            <td>${row.date}</td>
            <td>${row.userName}</td>
            <td style="text-align: left; line-height: 1.6;">${row.itemName}</td>
            <td>${row.note || "-"}</td>
            <td style="height: 45px;"></td>
          </tr>
        `).join("");
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger">載入報表失敗</td></tr>`;
      }
    }
  </script>
</body>
</html>
