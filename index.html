<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公司內部物資申購平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
  <!-- 頂部列 -->
  <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
    <h2 class="h4 mb-0 fw-bold text-primary">內部物資申購系統</h2>
    <div id="userInfo" class="d-none">
      <span id="userNameDisplay" class="me-2 fw-bold text-secondary"></span>
      <button class="btn btn-outline-danger btn-sm" onclick="logout()">登出</button>
    </div>
  </div>

  <!-- 1. 登入區塊 -->
  <div id="loginCard" class="card mx-auto shadow-sm" style="max-width: 400px; margin-top: 50px;">
    <div class="card-body p-4">
      <h5 class="card-title mb-3 fw-bold text-center">同仁登入</h5>
      <div class="mb-3">
        <label class="form-label text-muted small">電子郵件</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="user@company.org">
      </div>
      <div class="mb-3">
        <label class="form-label text-muted small">密碼</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="請輸入密碼">
      </div>
      <button class="btn btn-primary w-100 mt-2" id="loginBtn" onclick="login()">登入系統</button>
    </div>
  </div>

  <!-- 2. 主要功能區 (登入後顯示) -->
  <div id="mainContent" class="d-none">
    <!-- 頁籤導覽 -->
    <ul class="nav nav-tabs mb-4">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#shopTab">物資申購</button>
      </li>
      <li class="nav-item d-none" id="adminTabBtn">
        <button class="nav-link text-danger" data-bs-toggle="tab" data-bs-target="#adminTab">後台管理與報表</button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- 申購區 -->
      <div class="tab-pane fade show active" id="shopTab">
        <div class="row g-4">
          <div class="col-md-8">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="mb-0 fw-bold">可申購物資</h5>
              <button class="btn btn-sm btn-outline-secondary" onclick="loadProducts()">重新整理清單</button>
            </div>
            <div id="productList" class="row g-3">
              <div class="text-muted">載入物資清單中...</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card shadow-sm">
              <div class="card-body">
                <h5 class="card-title fw-bold mb-3">申請清單</h5>
                <ul id="cartList" class="list-group mb-3">
                  <li class="list-group-item text-muted text-center py-3">尚未選擇物資</li>
                </ul>
                <button class="btn btn-success w-100" id="submitBtn" onclick="submitOrder()">送出申請單</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 後台管理區 -->
      <div class="tab-pane fade" id="adminTab">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title fw-bold text-danger mb-3">匯出每月申購明細報表</h5>
            <p class="text-muted small">請選擇要匯出的月份，系統將會產生該月份所有同仁申購物資的 CSV 明細檔案。</p>
            <div class="row g-2 align-items-center">
              <div class="col-auto">
                <input type="month" id="reportMonth" class="form-control">
              </div>
              <div class="col-auto">
                <button class="btn btn-primary" onclick="downloadReport()">下載 CSV 報表</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Google Apps Script Web App API 網址
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwBBhH0RqhkWLyyqcgT86uYkuhpIbnAh5uH934wjd4priuU0jZ0bODNED1K08XMyqHZ/exec"; 
  
  let currentUser = null;
  let cart = [];

  // 通用的 POST 請求發送器（專門避開 CORS 預檢問題）
  async function postToGAS(data) {
    const response = await fetch(GAS_URL, {
      method: "POST",
      redirect: "follow",
      body: JSON.stringify(data)
    });
    return await response.json();
  }

  async function login() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value.trim();

    if (!email || !password) {
      alert("請填寫 Email 與密碼");
      return;
    }

    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.innerText = "驗證中...";

    try {
      const result = await postToGAS({ action: "login", email, password });

      if (result.success) {
        currentUser = { email, name: result.name, role: result.role };
        document.getElementById("loginCard").classList.add("d-none");
        document.getElementById("mainContent").classList.remove("d-none");
        document.getElementById("userInfo").classList.remove("d-none");
        document.getElementById("userNameDisplay").innerText = result.name;

        if (result.role === "admin") {
          document.getElementById("adminTabBtn").classList.remove("d-none");
        }
        loadProducts();
      } else {
        alert(result.message || "帳號或密碼錯誤");
      }
    } catch (err) {
      console.error("Login Error:", err);
      alert("連線失敗！請確認 Google Apps Script 部署設定為「所有人 (Anyone)」存取權。");
    } finally {
      btn.disabled = false;
      btn.innerText = "登入系統";
    }
  }

  function logout() {
    location.reload();
  }

  async function loadProducts() {
    const container = document.getElementById("productList");
    container.innerHTML = '<div class="text-muted">載入物資清單中...</div>';

    try {
      const res = await fetch(`${GAS_URL}?action=getProducts`);
      const products = await res.json();
      container.innerHTML = "";

      if (products.length === 0) {
        container.innerHTML = '<div class="text-muted">目前沒有上架的物資</div>';
        return;
      }

      products.forEach(p => {
        container.innerHTML += `
          <div class="col-md-6">
            <div class="card h-100 shadow-sm border-0 bg-white">
              <div class="card-body d-flex flex-column justify-content-between">
                <div>
                  <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="fw-bold mb-0">${p.name}</h6>
                    <span class="badge bg-light text-dark border">${p.category}</span>
                  </div>
                  <p class="text-muted small mb-2">庫存剩餘：<strong class="text-primary">${p.stock}</strong></p>
                </div>
                <button class="btn btn-sm btn-outline-primary mt-2 w-100" onclick="addToCart('${p.name}', ${p.stock})">加入申請單</button>
              </div>
            </div>
          </div>`;
      });
    } catch (err) {
      console.error("Load Products Error:", err);
      container.innerHTML = '<div class="text-danger">無法載入物資，請確認後台試算表權限與 GAS 部署。</div>';
    }
  }

  function addToCart(name, stock) {
    const exist = cart.find(i => i.name === name);
    if (exist) {
      if (exist.qty < stock) {
        exist.qty++;
      } else {
        alert("已達目前庫存上限！");
      }
    } else {
      cart.push({ name, qty: 1 });
    }
    renderCart();
  }

  function renderCart() {
    const list = document.getElementById("cartList");
    list.innerHTML = "";

    if (cart.length === 0) {
      list.innerHTML = '<li class="list-group-item text-muted text-center py-3">尚未選擇物資</li>';
      return;
    }

    cart.forEach((item, index) => {
      list.innerHTML += `
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <div>
            <div>${item.name}</div>
            <small class="text-muted">數量: ${item.qty}</small>
          </div>
          <button class="btn btn-sm btn-link text-danger p-0" onclick="removeFromCart(${index})">移除</button>
        </li>`;
    });
  }

  function removeFromCart(index) {
    cart.splice(index, 1);
    renderCart();
  }

  async function submitOrder() {
    if (cart.length === 0) return alert("請先選擇物資！");

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.innerText = "提交中...";

    const payload = {
      action: "createOrder",
      userEmail: currentUser.email,
      userName: currentUser.name,
      items: cart
    };

    try {
      const result = await postToGAS(payload);

      if (result.success) {
        alert("申請完成！已發送 Mail 通知的管理同工。");
        cart = [];
        renderCart();
        loadProducts();
      } else {
        alert("申請失敗，請再試一次。");
      }
    } catch (err) {
      console.error("Submit Order Error:", err);
      alert("提交發生錯誤，請檢查網路連線。");
    } finally {
      btn.disabled = false;
      btn.innerText = "送出申請單";
    }
  }

  async function downloadReport() {
    const month = document.getElementById("reportMonth").value;
    if (!month) return alert("請選擇要匯出的月份");

    try {
      const res = await fetch(`${GAS_URL}?action=getMonthlyReport&month=${month}`);
      const data = await res.json();

      if (data.length === 0) return alert("該月份查無申購紀錄");

      let csvContent = "data:text/csv;charset=utf-8,\uFEFF單號,日期,Email,姓名,物資名稱,申請數量\n";
      data.forEach(r => {
        csvContent += `${r.orderId},${r.date},${r.userEmail},${r.userName},${r.itemName},${r.qty}\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `物資申購明細報表_${month}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    } catch (err) {
      console.error("Report Error:", err);
      alert("報表產生失敗，請確認後台回傳格式。");
    }
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
